<section class="login">
  <div class="login__glow" aria-hidden="true"></div>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="login__card">
          <div class="login__cabecera">
            <span class="login__logo"><i class="bi bi-people-fill"></i></span>
            <h1 class="login__titulo">Bienvenido de nuevo</h1>
            <p class="login__subtitulo">
              Inicia sesión para administrar tu cartera de clientes.
            </p>
          </div>

          @if (mensaje) {
            <div class="login__error" role="alert">
              <i class="bi bi-exclamation-triangle-fill"></i>
              <span>{{ mensaje }}</span>
            </div>
          }

          <form (submit)="login()" class="login__form">
            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <div class="login__input">
                <i class="bi bi-envelope"></i>
                <input
                  type="email"
                  id="email"
                  class="form-control"
                  placeholder="tu@email.com"
                  [(ngModel)]="email"
                  name="email"
                  required
                  autocomplete="email"
                />
              </div>
            </div>

            <!-- Password -->
            <div class="mb-4">
              <label for="password" class="form-label">Contraseña</label>
              <div class="login__input">
                <i class="bi bi-lock"></i>
                <input
                  type="password"
                  id="password"
                  class="form-control"
                  placeholder="••••••••"
                  [(ngModel)]="password"
                  name="password"
                  required
                  autocomplete="current-password"
                />
              </div>
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100"
              [disabled]="cargando"
            >
              @if (cargando) {
                <span
                  class="spinner-border spinner-border-sm me-2"
                  role="status"
                  aria-hidden="true"
                ></span>
                Iniciando sesión…
              } @else {
                <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar sesión
              }
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
